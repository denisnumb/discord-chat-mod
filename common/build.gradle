plugins {
    id 'com.gradleup.shadow'
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.ftb.dev/releases" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'

    implementation("net.dv8tion:JDA:6.7.0")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.0")
    implementation("com.squareup.okio:okio:3.9.1")
    implementation("com.neovisionaries:nv-websocket-client:2.14")
    implementation("net.sf.trove4j:trove4j:3.0.3")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.15.2")
    implementation("com.fasterxml.jackson.core:jackson-core:2.15.2")
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.15.2")
    implementation("org.apache.commons:commons-collections4:4.4")
    implementation("org.json:json:20231013")
    implementation("org.jsoup:jsoup:1.17.2")
    implementation("com.electronwill.night-config:core:3.8.3")
    implementation("com.electronwill.night-config:toml:3.8.3")
    implementation("com.twelvemonkeys.imageio:imageio-webp:3.12.0")
    implementation("org.apache.logging.log4j:log4j-core:2.20.0")

    compileOnly("net.luckperms:api:${rootProject.luckperms_api_version}")
    modCompileOnly("dev.architectury:architectury:${rootProject.architectury_api_version}") { transitive = false }
    modCompileOnly("dev.ftb.mods:ftb-ranks:${rootProject.ftb_ranks_version}") { transitive = false }
}

tasks.test {
    useJUnitPlatform()
}

import com.denisnumb.buildtools.FillMissingTranslationsTask
import com.denisnumb.buildtools.GenerateBuildConstantsTask
import com.denisnumb.buildtools.GenerateLocaleProviderTask

tasks.register("generateBuildConstants", GenerateBuildConstantsTask) {
    packageName.set("com.denisnumb.discord_chat_mod")
    constants.put("MINECRAFT_VERSION", rootProject.minecraft_version.toString())
    constants.put("MOD_VERSION", rootProject.mod_version.toString())
    outputDirectory.set(layout.buildDirectory.dir("generated/sources/buildConstants"))
}

sourceSets.main.java.srcDir(tasks.named("generateBuildConstants").map { it.outputDirectory })
tasks.named("compileJava") { dependsOn("generateBuildConstants") }

def langDir = file("src/main/resources/assets/discord_chat_mod/lang")

tasks.register("generateLocaleProviders", GenerateLocaleProviderTask) {
    sourceJson.set(new File(langDir, "en_us.json"))
    outputDirectory.set(layout.buildDirectory.dir("generated/sources/localeProvider"))
}

sourceSets.main.java.srcDir(tasks.named("generateLocaleProviders").map { it.outputDirectory })
tasks.named("compileJava") { dependsOn("generateLocaleProviders") }

def fillMissingTranslations = tasks.register("fillMissingTranslations", FillMissingTranslationsTask) {
    sourceJson.set(new File(langDir, "en_us.json"))
    langDirectory.set(langDir)
    translator.set(providers.gradleProperty("locale.translator").orElse("google"))
    apiKey.set(providers.gradleProperty("locale.apiKey")
            .orElse(providers.environmentVariable("LOCALE_TRANSLATOR_API_KEY")))
    apiUrl.set(providers.gradleProperty("locale.apiUrl"))
    failOnError.set(providers.gradleProperty("locale.failOnError").map { it.toBoolean() }.orElse(false))
    removeObsoleteKeys.set(providers.gradleProperty("locale.removeObsoleteKeys").map { it.toBoolean() }.orElse(false))
}

if (providers.gradleProperty("locale.autoFill").map { it.toBoolean() }.getOrElse(true)) {
    // Everything that packs lang files must see the completed versions.
    tasks.matching { it.name in ["processResources", "sourcesJar"] }.configureEach {
        dependsOn(fillMissingTranslations)
    }
}