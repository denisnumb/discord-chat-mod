# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 2.9.0
maven_group = com.denisnumb.discord_chat_mod
archives_name = discord_chat_mod
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.11

# Dependencies
fabric_loader_version = 0.18.4
fabric_api_version = 0.141.3+1.21.11
neoforge_version = 21.11.42

# Optional integrations (compile only)
luckperms_api_version = 5.4
architectury_api_version = 19.0.1
ftb_ranks_version = 2111.1.0

# Localization autofill task settings
# Keys added to en_us.json are machine-translated into the other lang files on build.
# Translator possible values:
# - google (free, no key)
# - deepl (put locale.apiKey=... into ~/.gradle/gradle.properties, or set the LOCALE_TRANSLATOR_API_KEY environment variable)
locale.autoFill = false
locale.translator = google
locale.failOnError = false
locale.removeObsoleteKeys = false
