name: 💢 Mod Incompatibility Report
description: Report if everything works separately, but something doesn't work when running Discord & Chat Images with other mods.
labels: mod_incompatibility
body:
  - type: textarea
    attributes:
      label: Problem description
      description: >
        A detailed description of what is not working and how it should work.
    validations:
      required: true
  - type: input
    attributes:
      label: Minecraft Version
      description: >
        For example: 1.20.1
    validations:
      required: true
  - type: input
    attributes:
      label: Modloader Version
      description: >
        For example: Forge 47.3.0
    validations:
      required: true
  - type: input
    attributes:
      label: Discord Chat Mod Version
      description: >
        For example: 2.5.5
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Other installed mods"
      description: "Please list the specific mods you've encountered incompatibilities with, or all installed mods. If possible, please attach a zip file for downloading the entire modpack."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "latest.log file"
      description: "Attach your latest.log file"
    validations:
      required: false
  - type: textarea
    attributes:
      label: "crash-report file"
      description: "Attach your crash-report file (if exists)"
    validations:
      required: false
